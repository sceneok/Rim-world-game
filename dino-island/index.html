<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>다이노 아일랜드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D canvas, chunky storybook HUD cards pinned to the corners */
:root{
  --ink:#3b2a1a;        /* outlines, text */
  --paper:#fff8e6;      /* cards */
  --paper-2:#f3e6c4;
  --leaf:#5cbf3f;       /* primary buttons */
  --leaf-dark:#3d8f27;
  --sun:#ffc93c;        /* highlights, stamina */
  --berry:#e8505b;      /* health, danger */
  --meat:#f08a3c;       /* hunger */
  --sky:#2f8fd8;
  --muted:#8a7660;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd8ff;color:var(--ink);font-family:var(--font)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#hud > *{pointer-events:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}

/* stats */
#stats{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:10px 12px;width:min(250px,46vw);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bar{display:flex;align-items:center;gap:6px;font-size:14px}
.bar .ic{width:20px;text-align:center}
.track{flex:1;height:14px;border-radius:8px;background:#3b2a1a22;border:2px solid var(--ink);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:6px;transition:width .15s}
.hp .track i{background:var(--berry)}
.hg .track i{background:var(--meat)}
.st .track i{background:var(--sun)}
.bar b{width:28px;text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
#quest{margin-top:2px;padding-top:6px;border-top:2px dashed #3b2a1a44;font-size:13px;line-height:1.35}
#quest .ql{display:inline-block;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 6px;margin-right:6px;font-size:11px;letter-spacing:.05em}

/* map + clock */
#mapbox{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#minimap{width:130px;height:130px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:#2f8fd8}
#clock{padding:3px 10px;font-size:14px;border-radius:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* toasts */
#toasts{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(440px,60vw)}
.toast{background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:12px;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s}
.toast.good{background:var(--leaf-dark)}
.toast.bad{background:#b8323c}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* target prompt */
#prompt{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;white-space:nowrap}
#prompt .pn{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:14px}
#prompt .phb{width:90px;height:9px;border:2px solid var(--ink);border-radius:6px;background:#3b2a1a33;overflow:hidden}
#prompt .phb i{display:block;height:100%;background:var(--berry)}
#prompt .phb.res i{background:var(--leaf)}
#prompt .pk{font-size:12px;color:var(--paper);background:#3b2a1acc;border-radius:8px;padding:1px 8px}

#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 3px var(--ink);white-space:nowrap}
.fl.dmg{color:#ffe14d}
.fl.hurt{color:#ff6b6b;font-size:20px}

/* hotbar */
#hotbar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;align-items:center}
.slot{position:relative;width:54px;height:54px;border:3px solid var(--ink);border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 0 var(--ink);padding:0}
.slot:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.slot .k{position:absolute;left:4px;top:1px;font-size:11px;color:var(--muted)}
.slot .n{position:absolute;right:4px;bottom:1px;font-size:13px;font-variant-numeric:tabular-nums}
.slot.empty{opacity:.45}
.sep{width:3px;height:40px;background:#3b2a1a44;border-radius:2px;margin:0 2px}
.tool{width:40px;height:40px;border-radius:10px;border:2px dashed #3b2a1a66;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.35;filter:grayscale(1)}
.tool.on{opacity:1;filter:none;border:2px solid var(--ink);background:#fff}

#rbtns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.rb{border:3px solid var(--ink);border-radius:16px;background:var(--sun);box-shadow:0 4px 0 var(--ink);font-size:24px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.rb small{font-size:11px}
.rb.sm{background:var(--paper);font-size:18px;padding:6px 10px}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

#hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.5;color:#fff;text-shadow:0 1px 2px #000a;max-width:220px;pointer-events:none}

/* placement bar */
#placebar{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
.btn{border:3px solid var(--ink);border-radius:12px;background:var(--leaf);color:#fff;font-size:15px;padding:5px 14px;box-shadow:0 3px 0 var(--ink);text-shadow:0 1px 0 #0004}
.btn.alt{background:var(--paper);color:var(--ink);text-shadow:none}
.btn.red{background:var(--berry)}
.btn:disabled{background:#cfc4ad;color:#8a7d66;text-shadow:none;cursor:default}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* touch */
#touch{display:none}
.touch #touch{display:block}
.touch #hint,.touch .tool,.touch .sep{display:none}
.touch #hotbar{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.touch #rbtns{bottom:auto;top:calc(180px + env(safe-area-inset-top,0px))}
.touch #placebar{bottom:calc(220px + env(safe-area-inset-bottom,0px))}
#stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#fff8e655;border:3px solid #3b2a1a88;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
#tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:170px;height:130px}
#tbtns button{position:absolute;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:24px;touch-action:none}
#tAct{right:0;bottom:0;width:84px;height:84px;background:var(--sun)!important;font-size:34px!important}
#tJump{right:92px;bottom:0;width:58px;height:58px}
#tRun{right:20px;bottom:94px;width:52px;height:52px}
#tRun.on{background:var(--leaf)!important}

#hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px #e8000088;opacity:0;transition:opacity .25s}
#fade{position:absolute;inset:0;background:#0b1430;opacity:0;pointer-events:none;transition:opacity .8s}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:#1b2a3a66}
#panel .box{width:min(860px,100%);max-height:calc(100% - 8px);display:grid;grid-template-columns:240px 1fr;gap:14px;padding:16px;overflow:hidden}
#panel h2{margin:0 0 8px;font-size:20px;font-weight:400}
.col{min-width:0;display:flex;flex-direction:column;overflow:auto}
#invGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.it{border:2px solid var(--ink);border-radius:10px;background:var(--paper-2);padding:6px 4px;text-align:center;font-size:12px}
.it .e{font-size:22px;display:block}
.it .c{font-variant-numeric:tabular-nums;font-size:14px}
.it.zero{opacity:.4}
#tools2{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
#recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding-bottom:4px}
.rc{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 10px;display:grid;grid-template-columns:36px 1fr;gap:2px 8px;align-items:start}
.rc .ri{font-size:28px;grid-row:span 3;line-height:1.2}
.rc .rn{font-size:16px}
.rc .rd{font-size:12px;color:var(--muted)}
.rc .rcost{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{font-size:12px;border-radius:8px;padding:1px 6px;background:#e3f3d6;font-variant-numeric:tabular-nums}
.chip.no{background:#fbd6d6;color:#9c2730}
.rc .btn{grid-column:2;justify-self:start;font-size:13px;padding:3px 12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:640px){
  #panel .box{grid-template-columns:1fr;overflow:auto}
  .col{overflow:visible}
  #invGrid{grid-template-columns:repeat(5,1fr)}
}

#title{background:linear-gradient(#0000 40%,#1b2a3a88)}
#title .box{padding:22px 24px;width:min(460px,100%);text-align:center}
#title h1{margin:0;font-size:clamp(30px,10vw,46px);white-space:nowrap;font-weight:400;line-height:1;color:var(--leaf-dark);text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);letter-spacing:.02em}
#title .sub{margin:8px 0 16px;color:var(--muted);font-size:16px}
#title .btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:260px;margin:0 auto}
#title .btn{font-size:20px;padding:8px}
#title ul{list-style:none;padding:0;margin:16px 0 0;font-size:13px;line-height:1.7;color:var(--ink);text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 10px}
#title li{display:contents}
#title li span:first-child{color:var(--muted);text-align:right}
#death .box{padding:22px;text-align:center;width:min(360px,100%)}
#death h2{margin:0 0 6px;font-weight:400;font-size:28px;color:var(--berry)}
#death p{margin:0 0 14px;color:var(--muted)}
@media (max-width:520px){
  #minimap{width:96px;height:96px}
  #clock{font-size:12px}
  .slot{width:46px;height:46px;font-size:22px}
  #toasts{top:auto;bottom:calc(320px + env(safe-area-inset-bottom,0px));width:calc(100vw - 32px)}
}
@media (max-width:760px){
  #hint,#hotbar .tool,#hotbar .sep{display:none}
  body:not(.touch) #rbtns{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" hidden>
  <div id="stats" class="card">
    <div class="bar hp"><span class="ic">❤️</span><div class="track"><i id="hpBar"></i></div><b id="hpNum">100</b></div>
    <div class="bar hg"><span class="ic">🍗</span><div class="track"><i id="hgBar"></i></div><b id="hgNum">100</b></div>
    <div class="bar st"><span class="ic">⚡</span><div class="track"><i id="stBar"></i></div><b id="stNum">100</b></div>
    <div id="quest"><span class="ql">목표</span><span id="questText"></span></div>
  </div>
  <div id="mapbox"><canvas id="minimap" width="150" height="150"></canvas><div id="clock" class="card"></div></div>
  <div id="toasts"></div>
  <div id="prompt" hidden><div class="pn" id="pName"></div><div class="phb" id="pHb" hidden><i id="pHbI"></i></div><div class="pk" id="pKey"></div></div>
  <div id="floats"></div>
  <div id="hotbar" class="card"></div>
  <div id="hint">WASD 이동 · 드래그 시점 · 휠 줌<br>클릭/E 행동 · Shift 달리기 · Space 점프<br>1~4 먹기·사용 · C 가방/제작</div>
  <div id="rbtns">
    <button class="rb sm" id="soundBtn" title="소리 켜기/끄기">🔊</button>
    <button class="rb" id="bagBtn" title="가방 · 제작 (C)">🎒<small>제작 C</small></button>
  </div>
  <div id="placebar" class="card" hidden>
    <span id="placeName"></span>
    <button class="btn alt" id="pRot">↻ 회전 R</button>
    <button class="btn" id="pOk">설치 E</button>
    <button class="btn red" id="pCancel">취소 Esc</button>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns"><button id="tAct" aria-label="행동">✊</button><button id="tJump" aria-label="점프">⤒</button><button id="tRun" aria-label="달리기">🏃</button></div>
  </div>
  <div id="hurt"></div>
  <div id="fade"></div>
</div>

<div id="panel" class="overlay" hidden>
  <div class="box card">
    <div class="col">
      <h2>🎒 가방</h2>
      <div id="invGrid"></div>
      <h2 style="margin-top:14px">도구</h2>
      <div id="tools2"></div>
    </div>
    <div class="col">
      <div class="ph"><h2>🔨 제작</h2><button class="btn alt" id="closePanel">닫기 C</button></div>
      <div id="recipes"></div>
    </div>
  </div>
</div>

<div id="title" class="overlay">
  <div class="box card">
    <h1>다이노 아일랜드</h1>
    <div class="sub">공룡이 사는 섬에서 살아남기</div>
    <div class="btns">
      <button class="btn" id="btnNew">새로 시작</button>
      <button class="btn alt" id="btnCont" hidden>이어하기</button>
    </div>
    <ul>
      <li><span>이동</span><span>WASD · 방향키 (폰: 왼쪽 조이스틱)</span></li>
      <li><span>시점</span><span>마우스 드래그 · 휠로 줌</span></li>
      <li><span>행동</span><span>클릭 또는 E — 벌목·채굴·채집·사냥</span></li>
      <li><span>달리기·점프</span><span>Shift · Space</span></li>
      <li><span>가방·제작</span><span>C — 도구, 모닥불, 울타리, 움막</span></li>
    </ul>
  </div>
</div>

<div id="death" class="overlay" hidden>
  <div class="box card">
    <h2>쓰러졌어요</h2>
    <p id="deathText">가진 자원의 절반을 잃었어요.</p>
    <button class="btn" id="btnRespawn">다시 일어나기</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srand=mulberry32(20261018);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const turnTo=(cur,want,max)=>cur+clamp(wrapA(want-cur),-max,max);
const $=id=>document.getElementById(id);

function hash2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(hash2(xi,zi),hash2(xi+1,zi),u),lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u),v)}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=vnoise(x*f,z*f)*a;f*=2.03;a*=.5}return s/.9375}

const ISLAND_R=165;
function heightAt(x,z){
  const d=Math.hypot(x,z)/ISLAND_R;
  const wob=(fbm(x*.012+7.3,z*.012-3.1)-.5)*.45;
  const land=1-smooth(.62,1.02,d+wob);
  const hills=fbm(x*.018,z*.018);
  const mt=Math.max(0,fbm(x*.007+40,z*.007+11)-.48)*2;
  return -6+land*8.5+land*land*(hills*9-2+mt*mt*55);
}

/* ================= renderer / scene ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd8ff);
scene.fog=new THREE.Fog(0x8fd8ff,70,290);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1200);
const hemi=new THREE.HemisphereLight(0xd6f1ff,0x6b8f3a,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,2.4);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:220});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);
const fireLight=new THREE.PointLight(0xffa040,0,18,2);scene.add(fireLight);

/* ================= geometry helpers ================= */
const _e=new THREE.Euler(),_m4=new THREE.Matrix4(),_qa=new THREE.Quaternion();
function part(geo,color,m={}){
  geo=geo.index?geo.toNonIndexed():geo;
  if(geo.attributes.uv)geo.deleteAttribute('uv');
  _e.set(...(m.r||[0,0,0]),m.o||'XYZ');
  _m4.compose(new THREE.Vector3(...(m.p||[0,0,0])),_qa.setFromEuler(_e),new THREE.Vector3(...(m.s||[1,1,1])));
  geo.applyMatrix4(_m4);
  const c=new THREE.Color(color),n=geo.attributes.position.count,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){const j=1+(Math.random()-.5)*.06;arr[i*3]=c.r*j;arr[i*3+1]=c.g*j;arr[i*3+2]=c.b*j}
  geo.setAttribute('color',new THREE.BufferAttribute(arr,3));
  return geo;
}
function merge(parts){
  let n=0;for(const p of parts)n+=p.attributes.position.count;
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
  for(const p of parts){pos.set(p.attributes.position.array,o);nor.set(p.attributes.normal.array,o);col.set(p.attributes.color.array,o);o+=p.attributes.position.count*3}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeBoundingSphere();return g;
}
const propMat=new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95});
const matCache={};
const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85}));
function mk(geo,c,x=0,y=0,z=0,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;return m}

function terrainColor(y,ny,x,z){
  const v=fbm(x*.05,z*.05);
  if(y<.4)return 0xd9c27a;
  if(y<2.6)return 0xf3dc8f;
  if(ny<.78&&y>3)return 0xa89784;
  if(y<13)return v>.55?0x8edb5a:0x72c84a;
  if(y<21)return v>.5?0x5cb244:0x4ea33b;
  if(y<27)return 0xa89784;
  return 0xd8d0c4;
}

const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_v=new THREE.Vector3(),_s=new THREE.Vector3(),_ax=new THREE.Vector3();
const UP=new THREE.Vector3(0,1,0);
function nodeMatrix(n){
  const s=n.visible?n.s*Math.max(.001,n.grow):0;
  _q.setFromAxisAngle(UP,n.rot);
  let tilt=n.fallAng;
  if(n.shake>0)tilt+=Math.sin(n.shake*50)*.07*(n.shake/.3);
  if(tilt){_ax.set(n.fdz,0,-n.fdx).normalize();_q2.setFromAxisAngle(_ax,tilt);_q.premultiply(_q2)}
  _v.set(n.x,n.y,n.z);
  _m.compose(_v,_q,_s.set(s*n.sx,s*n.sy,s*n.sx));
  n.im.setMatrixAt(n.idx,_m);n.im.instanceMatrix.needsUpdate=true;
  if(n.berry){if(!n.hasBerries||!n.visible)_m.compose(_v,_q,_s.set(0,0,0));n.berry.setMatrixAt(n.idx,_m);n.berry.instanceMatrix.needsUpdate=true}
}
function addNode(kind,key,x,z){
  const im=inst[key];if(im.count>=im.instanceMatrix.count)return;
  const idx=im.count++;
  const s=kind==='tree'?.85+srand()*.45:kind==='rock'?.7+srand()*.8:.8+srand()*.4;
  const n={kind,key,im,idx,x,z,y:heightAt(x,z)-.1,rot:srand()*Math.PI*2,s,sx:1,sy:kind==='tree'?.9+srand()*.3:1,
    r:kind==='tree'?.55*s:kind==='rock'?1.15*s:0,hp:0,max:kind==='tree'?10:kind==='rock'?12:1,
    active:true,visible:true,grow:1,shake:0,fall:0,fallAng:0,fdx:1,fdz:0,respawn:0,hasBerries:true};
  n.hp=n.max;
  if(kind==='bush'){n.berry=inst.berry;inst.berry.count=Math.max(inst.berry.count,idx+1)}
  const c=new THREE.Color().setHSL(0,0,.88+srand()*.22);im.setColorAt(idx,c);
  if(n.berry)n.berry.setColorAt(idx,new THREE.Color(1,1,1));
  nodes.push(n);nodeMatrix(n);
}

function addEyes(head,x,y,z,r,iris=0xffffff){
  for(const s of[-1,1]){
    const e=mk(G.ball(r,1),iris,s*x,y,z);e.castShadow=false;head.add(e);
    const p=mk(G.ball(r*.55,1),0x1c1410,s*(x+r*.55),y+r*.1,z+r*.3);p.castShadow=false;head.add(p);
  }
}
function buildDino(T){
  const b=T.b,g=new THREE.Group(),root=new THREE.Group();g.add(root);
  const cy=b.leg+b.bh*.4,legs=[];
  const body=mk(G.ball(.5,1),b.color,0,cy,0);body.scale.set(b.bw,b.bh,b.bl);root.add(body);
  const belly=mk(G.ball(.46,1),b.belly,0,cy-b.bh*.14,b.bl*.06);belly.scale.set(b.bw*.82,b.bh*.72,b.bl*.82);root.add(belly);
  const tail=new THREE.Group();tail.position.set(0,cy+b.bh*.05,-b.bl*.38);root.add(tail);
  const tc=mk(G.cone(b.tailR,b.tail,7),b.color,0,0,-b.tail/2,-Math.PI/2+.12);tail.add(tc);
  if(b.stripes)for(let i=0;i<3;i++){const s=mk(G.box(b.bw*.7,.08,.12),b.accent,0,cy+b.bh*.47,-.35+i*.3);root.add(s)}
  if(b.spots)for(let i=0;i<5;i++){const s=mk(G.ball(.32,0),b.accent,(i%2?.35:-.35)*b.bw,cy+b.bh*.42,-1+i*.5);s.scale.y=.35;root.add(s)}
  let neck,head;
  if(T.kind==='biped'){
    for(const s of[-1,1]){
      const L=new THREE.Group();L.position.set(s*b.bw*.28,b.leg+.05,-b.bl*.05);root.add(L);
      L.add(mk(G.box(.26,b.leg*.6,.36),b.color,0,-b.leg*.25,0));
      L.add(mk(G.box(.16,b.leg*.55,.18),b.color,0,-b.leg*.68,-.06));
      L.add(mk(G.box(.26,.1,.38),b.accent,0,-b.leg+.05,.08));
      legs.push(L);
      root.add(mk(G.box(.1,.32,.1),b.color,s*b.bw*.3,cy-.05,b.bl*.4,-.7));
    }
    neck=new THREE.Group();
    if(b.head==='round'){
      neck.position.set(0,cy+b.bh*.25,b.bl*.36);neck.rotation.x=.3;root.add(neck);
      neck.add(mk(G.cyl(.17,.22,.45,7),b.color,0,.2,0));
      head=new THREE.Group();head.position.set(0,.5,0);head.rotation.x=-.3;neck.add(head);
      head.add(mk(G.ball(.34,1),b.color,0,0,0));
      const sn=mk(G.ball(.24,1),b.belly,0,-.06,.25);sn.scale.set(1,.8,1.15);head.add(sn);
      head.add(mk(G.cone(.12,.35,5),b.accent,0,.36,-.08,-.4));
      addEyes(head,.22,.08,.12,.09);
    }else{
      neck.position.set(0,cy+b.bh*.2,b.bl*.4);neck.rotation.x=.75;root.add(neck);
      neck.add(mk(G.cyl(.13,.18,.45,6),b.color,0,.2,0));
      head=new THREE.Group();head.position.set(0,.45,.05);head.rotation.x=-.75;neck.add(head);
      head.add(mk(G.box(.34,.3,.7),b.color,0,0,.18));
      head.add(mk(G.box(.28,.1,.56),b.belly,0,-.18,.2));
      for(let i=0;i<4;i++)for(const s of[-1,1])head.add(mk(G.cone(.03,.08,4),0xffffff,s*.11,-.13,.25+i*.1,Math.PI));
      for(let i=0;i<3;i++)head.add(mk(G.cone(.05,.25,4),b.accent,0,.2,-.1-i*.1,-.6-i*.2));
      addEyes(head,.17,.07,.2,.07,0xffd23f);
    }
  }else{
    const lr=.17*b.bw;
    for(const[sx,sz]of[[-1,1],[1,1],[-1,-1],[1,-1]]){
      const L=new THREE.Group();L.position.set(sx*b.bw*.32,b.leg+.05,sz*b.bl*.28);root.add(L);
      L.add(mk(G.cyl(lr,lr*.9,b.leg+.1,7),b.color,0,-(b.leg+.1)/2+.05,0));
      L.add(mk(G.cyl(lr*1.15,lr*1.2,.14,7),b.belly,0,-b.leg+.02,0));
      legs.push(L);
    }
    neck=new THREE.Group();
    if(b.head==='trike'){
      neck.position.set(0,cy+b.bh*.05,b.bl*.45);root.add(neck);
      head=new THREE.Group();neck.add(head);
      head.add(mk(G.box(.75,.6,.8),b.color,0,0,.3));
      head.add(mk(G.cone(.24,.4,5),b.belly,0,-.1,.82,Math.PI/2));
      const fr=mk(G.cyl(.85,.85,.12,9),b.accent,0,.35,-.05,Math.PI/2-.45);head.add(fr);
      for(const s of[-1,1])head.add(mk(G.cone(.08,.8,5),0xfff3d6,s*.2,.38,.6,Math.PI/2-.35));
      head.add(mk(G.cone(.07,.3,5),0xfff3d6,0,.12,.78,Math.PI/2-.6));
      addEyes(head,.36,.14,.4,.09);
    }else{
      neck.position.set(0,cy+b.bh*.3,b.bl*.38);neck.rotation.x=.55;root.add(neck);
      neck.add(mk(G.cyl(.28,.48,4.2,8),b.color,0,2,0));
      head=new THREE.Group();head.position.set(0,4.15,.05);head.rotation.x=-.55;neck.add(head);
      head.add(mk(G.box(.55,.48,.85),b.color,0,0,.2));
      addEyes(head,.28,.1,.3,.09);
    }
  }
  return{g,root,legs,tail,neck,head};
}
const dinos=[];
class Dino{
  constructor(type,x,z){
    this.type=type;this.T=DT[type];const p=buildDino(this.T);Object.assign(this,p);
    this.g.scale.setScalar(this.T.scale);
    this.x=x;this.z=z;this.yaw=Math.random()*Math.PI*2;this.hp=this.T.hp;
    this.state='wander';this.timer=Math.random()*3;this.tx=x;this.tz=z;this.phase=Math.random()*6;
    this.v=0;this.atkCd=0;this.angry=0;this.flee=0;this.squash=0;this.lunge=0;this.dead=false;this.deathT=0;this.amp=0;
    scene.add(this.g);this.sync();dinos.push(this);
  }
  sync(){this.g.position.set(this.x,Math.max(heightAt(this.x,this.z),-.7),this.z);this.g.rotation.y=this.yaw}
  hit(dmg){
    if(this.dead)return;
    this.hp-=dmg;this.squash=.2;
    if(this.T.beh==='skittish')this.flee=4;
    else if(this.T.beh==='defensive'){if(this.angry<=0)sfx('roar');this.angry=14}
    else this.state='chase';
    if(this.hp<=0)this.die();
  }
  die(){
    this.dead=true;this.deathT=0;this.hp=0;
    const got=[];for(const k in this.T.drops){const n=this.T.drops[k];inv[k]+=n;got.push(ITEMS[k].i+'+'+n)}
    invDirty=true;stats.kills++;if(this.type==='trike')stats.trikeKills++;
    floatText(got.join(' '),this.x,this.g.position.y+this.T.tag,this.z);
    toast(`${this.T.name} 사냥 성공!`,'good');sfx('craft');
  }
  remove(){scene.remove(this.g);const i=dinos.indexOf(this);if(i>=0)dinos.splice(i,1)}
  update(dt,time){
    const T=this.T;
    if(this.dead){
      this.deathT+=dt;const p=Math.min(1,this.deathT/.6);
      this.root.rotation.z=p*Math.PI/2*.95;this.root.position.y=p*T.b.bw*.25;
      if(this.deathT>3)this.g.position.y-=dt*1.2;
      if(this.deathT>5)this.remove();
      return;
    }
    const dx=player.x-this.x,dz=player.z-this.z,dist=Math.hypot(dx,dz);
    this.atkCd-=dt;this.angry-=dt;this.flee-=dt;this.timer-=dt;
    const canSee=started&&!player.dead;
    let mode='wander',wantSpeed=0,wantYaw=this.yaw;
    if(T.beh==='aggressive'){
      const aggro=isNight()?22:13;
      if(this.hp<=T.hp*.25&&dist<30)mode='flee';
      else if(canSee&&(this.state==='chase'?dist<34:dist<aggro)){mode='chase';if(this.state!=='chase')sfx('roar')}
    }else if(T.beh==='skittish'){
      if(this.flee>0||(canSee&&dist<5.5)){mode='flee';if(this.flee<=0)this.flee=2.5}
    }else if(this.angry>0&&canSee&&dist<40)mode='chase';
    this.state=mode;
    if(mode==='chase'){
      wantYaw=Math.atan2(dx,dz);const reach=T.radius+1.3;
      if(dist>reach)wantSpeed=T.run;
      else if(this.atkCd<=0&&Math.abs(wrapA(wantYaw-this.yaw))<.9){
        this.atkCd=T.beh==='aggressive'?1.3:1.9;this.lunge=.35;damagePlayer(T.dmg,this);
      }
    }else if(mode==='flee'){wantYaw=Math.atan2(-dx,-dz);wantSpeed=T.run}
    else{
      if(this.timer<=0){
        if(Math.random()<.4){this.tx=this.x;this.tz=this.z;this.timer=2+Math.random()*4}
        else{const a=Math.random()*Math.PI*2,r=6+Math.random()*14;this.tx=this.x+Math.cos(a)*r;this.tz=this.z+Math.sin(a)*r;
          if(heightAt(this.tx,this.tz)<1.5){this.tx=this.x*.8;this.tz=this.z*.8}this.timer=4+Math.random()*6}
      }
      const ddx=this.tx-this.x,ddz=this.tz-this.z;
      if(Math.hypot(ddx,ddz)>1){wantYaw=Math.atan2(ddx,ddz);wantSpeed=T.speed}
    }
    const diff=wrapA(wantYaw-this.yaw);
    this.yaw=turnTo(this.yaw,wantYaw,(T.kind==='biped'?4.5:2.2)*dt);
    if(Math.abs(diff)>1.2)wantSpeed*=.35;
    this.v=lerp(this.v,wantSpeed,1-Math.exp(-dt*5));
    const nx=this.x+Math.sin(this.yaw)*this.v*dt,nz=this.z+Math.cos(this.yaw)*this.v*dt;
    const nh=heightAt(nx,nz);
    if(nh<.3&&nh<heightAt(this.x,this.z)){this.timer=0;if(mode==='flee')this.yaw+=1.2*dt*10}
    else{this.x=nx;this.z=nz}
    const pt={x:this.x,z:this.z};for(const b of buildings)if(Math.abs(b.x-pt.x)<6&&Math.abs(b.z-pt.z)<6)pushOut(pt,T.radius*.8,b);
    this.x=pt.x;this.z=pt.z;
    // animation
    const bi=T.kind==='biped';
    this.phase+=dt*this.v*(bi?2.4:1.7)/T.scale;
    this.amp=lerp(this.amp,Math.min(1,this.v/1.5)*(bi?.75:.45),1-Math.exp(-dt*8));
    const offs=bi?[0,Math.PI]:[0,Math.PI,Math.PI,0];
    this.legs.forEach((l,i)=>l.rotation.x=Math.sin(this.phase+offs[i])*this.amp);
    this.tail.rotation.y=Math.sin(time*2.2+this.phase*.5)*.25;
    this.root.position.y=Math.abs(Math.sin(this.phase))*.06*this.amp;
    this.head.rotation.y=this.v<.3?Math.sin(time*.8+this.phase)*.35:0;
    if(this.lunge>0){this.lunge-=dt;this.root.position.z=Math.sin((.35-this.lunge)/.35*Math.PI)*.5}else this.root.position.z=0;
    if(this.squash>0){this.squash-=dt;const q=Math.sin(this.squash/.2*Math.PI)*.18;this.g.scale.set(T.scale*(1+q),T.scale*(1-q),T.scale*(1+q))}
    else this.g.scale.setScalar(T.scale);
    this.sync();
    this.g.visible=dist<140;
  }
}

function makeBuildingMesh(type){

const buildings=[];
function addBuilding(type,x,z,yaw){
  const mesh=makeBuildingMesh(type);
  const y=Math.min(...BUILD[type].samples.map(([sx,sz])=>{const w=localToWorld(sx,sz,yaw);return heightAt(x+w[0],z+w[1])}))-.05;

  const b={type,x,z,yaw,mesh,col:BUILD[type].col};buildings.push(b);return b;
}
function localToWorld(lx,lz,yaw){const c=Math.cos(yaw),s=Math.sin(yaw);return[lx*c+lz*s,-lx*s+lz*c]}
function pushOut(p,r,b){
  const dx=p.x-b.x,dz=p.z-b.z;
  if(b.col.t==='c'){const d=Math.hypot(dx,dz),m=r+b.col.r;if(d<m&&d>1e-4){p.x=b.x+dx/d*m;p.z=b.z+dz/d*m}return}
  const c=Math.cos(b.yaw),s=Math.sin(b.yaw);
  const lx=dx*c-dz*s,lz=dx*s+dz*c,{hx,hz}=b.col;
  const cx=clamp(lx,-hx,hx),cz=clamp(lz,-hz,hz);let ex=lx-cx,ez=lz-cz;const d=Math.hypot(ex,ez);
  let px=0,pz=0;
  if(d>1e-4){if(d>=r)return;px=ex/d*(r-d);pz=ez/d*(r-d)}
  else{const ox=hx-Math.abs(lx)+r,oz=hz-Math.abs(lz)+r;if(ox<oz)px=Math.sign(lx||1)*ox;else pz=Math.sign(lz||1)*oz}
  p.x+=px*c+pz*s;p.z+=-px*s+pz*c;
}

let placing=null;
const ghostOk=new THREE.MeshBasicMaterial({color:0x6cff6c,transparent:true,opacity:.45,depthWrite:false});
const ghostBad=new THREE.MeshBasicMaterial({color:0xff5050,transparent:true,opacity:.45,depthWrite:false});
function startPlacing(type,recipe){
  closePanel();cancelPlacing();
  const mesh=makeBuildingMesh(type);mesh.traverse(o=>{if(o.isMesh){o.material=ghostOk;o.castShadow=false}});scene.add(mesh);
  placing={type,recipe,mesh,rot:0,ok:false,x:0,z:0,yaw:0};
  $('placebar').hidden=false;$('placeName').textContent=`${recipe.icon} ${recipe.name} 설치`;
}
function cancelPlacing(){if(!placing)return;scene.remove(placing.mesh);placing=null;$('placebar').hidden=true}
function updatePlacing(){
  if(!placing)return;const B=BUILD[placing.type];
  const yaw=Math.round(player.yaw/(Math.PI/8))*(Math.PI/8)+placing.rot;
  const x=player.x+Math.sin(player.yaw)*B.dist,z=player.z+Math.cos(player.yaw)*B.dist;
  let ok=true;
  for(const[sx,sz,sr]of B.samples){
    const w=localToWorld(sx,sz,yaw),px=x+w[0],pz=z+w[1];
    if(heightAt(px,pz)<.5){ok=false;break}
    for(const n of nodes)if(n.r>0&&n.visible&&Math.abs(n.x-px)<5&&Math.hypot(n.x-px,n.z-pz)<n.r+sr){ok=false;break}
    for(const b of buildings){if(Math.abs(b.x-px)>8||Math.abs(b.z-pz)>8)continue;
      for(const[bx,bz,br]of BUILD[b.type].samples){const bw=localToWorld(bx,bz,b.yaw);if(Math.hypot(b.x+bw[0]-px,b.z+bw[1]-pz)<br+sr-(b.type==='fence'&&placing.type==='fence'?.35:0)){ok=false;break}}}
    if(!ok)break;
  }
  placing.ok=ok;placing.x=x;placing.z=z;placing.yaw=yaw;
  placing.mesh.position.set(x,heightAt(x,z)+.02,z);placing.mesh.rotation.y=yaw;
  placing.mesh.traverse(o=>{if(o.isMesh)o.material=ok?ghostOk:ghostBad});
}
function confirmPlace(){
  if(!placing)return;
  if(!placing.ok){toast('여기엔 지을 수 없어요','bad');return}
  if(!canAfford(placing.recipe.cost)){toast('재료가 부족해요','bad');cancelPlacing();return}
  pay(placing.recipe.cost);
  addBuilding(placing.type,placing.x,placing.z,placing.yaw);
  sfx('craft');toast(`${placing.recipe.name}을(를) 지었어요`,'good');
  const {type,recipe}=placing;cancelPlacing();
  if(type==='shelter'){player.spawn={x:player.x,z:player.z}}
  if(type==='fence'&&canAfford(recipe.cost))startPlacing(type,recipe);
  save();
}

  sun.position.set(player.x+ld.x*90,player.y+ld.y*90,player.z+ld.z*90);sun.target.position.set(player.x,player.y,player.z);
  sun.intensity=e>0?lerp(.4,2.5,dayF):.45;

/* ================= dino population ================= */
function randomLand(minH,maxH,minDist){
  for(let i=0;i<200;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*ISLAND_R,x=Math.cos(a)*r,z=Math.sin(a)*r,h=heightAt(x,z);
    if(h>=minH&&h<=maxH&&Math.hypot(x-player.x,z-player.z)>=minDist)return[x,z]}
  return null;
}
const WANT={paka:14,trike:7,longneck:4};
const spawnCd={paka:0,trike:0,longneck:0,raptor:0};
function populate(initial=false){
  const want={...WANT,raptor:isNight()?10:4};
  for(const type in want){
    const cnt=dinos.filter(d=>d.type===type&&!d.dead).length;
    if(cnt<want[type]&&(initial||spawnCd[type]<=0)){
      const n=initial?want[type]-cnt:1;
      for(let i=0;i<n;i++){
        const md=initial?(type==='raptor'?70:type==='paka'?18:35):45;
        const p=type==='longneck'?randomLand(3,12,md):type==='raptor'?randomLand(4,24,md):randomLand(2.8,16,md);
        if(p)new Dino(type,p[0],p[1]);
      }
      spawnCd[type]=type==='raptor'&&isNight()?5:12;
    }
    if(type==='raptor'&&cnt>want.raptor){
      const d=dinos.find(d=>d.type==='raptor'&&!d.dead&&d.state!=='chase'&&Math.hypot(d.x-player.x,d.z-player.z)>60);
      if(d)d.remove();
    }
  }
  // a couple of friendly pakas always graze near the start beach
  if(initial)for(let i=0;i<2;i++){const x=SPAWN.x+(i?14:-12),z=SPAWN.z-18-i*4;if(heightAt(x,z)>1)new Dino('paka',x,z)}
}

function damagePlayer(dmg,src){
  if(player.dead||player.invuln>0)return;
  const d=Math.round(dmg*(tools.armor?.65:1)*(.85+Math.random()*.3));
  player.hp-=d;player.invuln=.45;camShake=.35;
  const dx=player.x-src.x,dz=player.z-src.z,l=Math.hypot(dx,dz)||1;player.kx=dx/l*7;player.kz=dz/l*7;
  floatText('-'+d,player.x,player.y+2.2,player.z,'hurt');sfx('hurt');
  $('hurt').style.opacity=1;setTimeout(()=>$('hurt').style.opacity=0,180);
  if(player.hp<=0)die();
}
function targetInfo(t){
  if(!t)return null;
  if(t.dino)return{x:t.dino.x,z:t.dino.z,r:t.dino.T.radius};
  if(t.node)return{x:t.node.x,z:t.node.z,r:t.node.r||.9};
  if(t.b)return{x:t.b.x,z:t.b.z,r:t.b.type==='shelter'?2.1:.9};
}
function findTarget(){
  let best=null,bs=1e9;const fx=Math.sin(player.yaw),fz=Math.cos(player.yaw);
  const consider=(obj,x,z,r,reach=2.3)=>{const dx=x-player.x,dz=z-player.z,h=Math.hypot(dx,dz),d=h-r;if(d>reach)return;
    const dot=h>1e-3?(dx*fx+dz*fz)/h:1;const s=d-dot*1.2;if(s<bs){bs=s;best=obj}};
  for(const d of dinos)if(!d.dead&&Math.abs(d.x-player.x)<10&&Math.abs(d.z-player.z)<10)consider({dino:d},d.x,d.z,d.T.radius,2.6);
  for(const n of nodes)if(n.active&&Math.abs(n.x-player.x)<5&&Math.abs(n.z-player.z)<5)consider({node:n},n.x,n.z,n.r||.9);
  for(const b of buildings)if((b.type==='fire'||b.type==='shelter')&&Math.abs(b.x-player.x)<7&&Math.abs(b.z-player.z)<7)consider({b},b.x,b.z,b.type==='shelter'?2.1:.9);
  return best;
}
function chooseTool(t){
  if(!t)return player.tool;
  if(t.node?.kind==='tree')return tools.axe?'axe':null;
  if(t.node?.kind==='rock')return tools.pick?'pick':null;
  if(t.dino)return tools.spear?'spear':tools.axe?'axe':tools.pick?'pick':null;
  return null;
}
function doAction(){
  if(!started||player.dead||uiOpen())return;
  if(placing){confirmPlace();return}
  if(player.swing>0)return;
  const t=player.target;
  if(t?.b?.type==='fire'){cook();return}
  if(t?.b?.type==='shelter'){sleep(t.b);return}
  if(player.stamina<3){toast('너무 지쳤어요. 잠시 쉬세요','bad');player.swing=.3;player.swingTarget=null;return}
  player.swing=.42;player.swingHit=false;player.swingTarget=t;player.stamina-=3;
  player.tool=chooseTool(t);
}
function applyHit(t){
  const ti=targetInfo(t);if(!ti)return;
  if(Math.hypot(ti.x-player.x,ti.z-player.z)-ti.r>3.2)return;
  if(t.dino){
    const d=t.dino;if(d.dead)return;
    const base=tools.spear?22:tools.axe?11:tools.pick?9:5;const dmg=Math.round(base*(.85+Math.random()*.3));
    d.hit(dmg);floatText(dmg,d.x,d.g.position.y+d.T.tag*.8,d.z,'dmg');sfx('hit');
    burst(d.x,d.g.position.y+d.T.tag*.4,d.z,'star',6);camShake=Math.max(camShake,.12);
    return;
  }
  const n=t.node;if(!n.active)return;
  n.fdx=(n.x-player.x);n.fdz=(n.z-player.z);const l=Math.hypot(n.fdx,n.fdz)||1;n.fdx/=l;n.fdz/=l;
  n.shake=.3;animNodes.add(n);
  if(n.kind==='bush'){
    inv.berry+=3;inv.fiber+=2;stats.berries++;n.hasBerries=false;n.active=false;n.respawn=70;
    floatText('🍓+3 🌿+2',n.x,n.y+1.6,n.z);burst(n.x,n.y+.8,n.z,'leaf',6);sfx('pick');
  }else{
    const isTree=n.kind==='tree',has=isTree?tools.axe:tools.pick;
    const amt=Math.min(n.hp,has?3:1);n.hp-=amt;
    const key=isTree?'wood':'stone';inv[key]+=amt;
    floatText(`${ITEMS[key].i}+${amt}`,n.x,n.y+(isTree?2.4:1.4),n.z);
    burst(n.x,n.y+(isTree?1.2:.6),n.z,isTree?'wood':'stone',5);sfx(isTree?'chop':'stone');
    if(n.hp<=0){
      n.active=false;n.respawn=isTree?110:140;
      if(isTree){n.fall=.001;inv.wood+=2;inv.fiber+=1;setTimeout(()=>floatText('🪵+2 🌿+1',n.x,n.y+2,n.z),250)}
      else{n.visible=false;burst(n.x,n.y+.6,n.z,'stone',10);if(Math.random()<.5){inv.stone+=2;floatText('🪨+2',n.x,n.y+1.8,n.z)}}
    }
  }
  invDirty=true;
}
function cook(){
  if(player.cookCd>0)return;
  if(inv.meat<=0){toast('구울 날고기가 없어요. 공룡을 사냥해 보세요','bad');player.cookCd=.6;return}

function sleep(b){

const pGeo=new THREE.BoxGeometry(.16,.16,.16);const parts=[];

  p.vx=(Math.random()-.5)*5;p.vy=2+Math.random()*4;p.vz=(Math.random()-.5)*5;p.life=.7+Math.random()*.3}}
function updateParticles(dt){for(const p of parts){if(p.life<=0)continue;p.life-=dt;p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
  p.m.rotation.x+=dt*8;p.m.rotation.y+=dt*6;p.m.scale.setScalar(Math.max(.01,p.life));if(p.life<=0)p.m.visible=false}}

function updateFloats(dt){

  else if(t.b){const b=t.b;x=b.x;z=b.z;y=b.mesh.position.y+(b.type==='fire'?1.8:3.6);
    name=b.type==='fire'?`🔥 고기 굽기 (날고기 ${inv.meat})`:isNight()?'⛺ 잠자기':'⛺ 휴식 · 부활 지점 설정'}
  const s=project(x,y,z);if(!s.vis){el.hidden=true;return}
  el.hidden=false;el.style.left=s.x+'px';el.style.top=s.y+'px';
  $('pName').textContent=name;$('pKey').textContent=key;
  $('pHb').hidden=hb===null;$('pHb').classList.toggle('res',res);if(hb!==null)$('pHbI').style.width=(hb*100)+'%';
}
// minimap
const mm=$('minimap'),mctx=mm.getContext('2d');const MM=150,MR=200;
const mmBase=document.createElement('canvas');mmBase.width=mmBase.height=MM;
{const c=mmBase.getContext('2d'),img=c.createImageData(MM,MM),col=new THREE.Color();
  for(let j=0;j<MM;j++)for(let i=0;i<MM;i++){const x=(i/MM*2-1)*MR,z=(j/MM*2-1)*MR,h=heightAt(x,z);
    col.set(h<0?0x2f8fd8:h<2.6?0xf3dc8f:h<13?0x72c84a:h<21?0x4ea33b:h<27?0xa89784:0xe8e2d8);if(h<0&&h>-1.5)col.set(0x5cc6f0);
    const o=(j*MM+i)*4;img.data[o]=Math.round(col.r**(1/2.2)*255);img.data[o+1]=Math.round(col.g**(1/2.2)*255);img.data[o+2]=Math.round(col.b**(1/2.2)*255);img.data[o+3]=255}
  c.putImageData(img,0,0)}
function drawMinimap(){
  mctx.clearRect(0,0,MM,MM);mctx.drawImage(mmBase,0,0);
  const toM=(x,z)=>[(x/MR*.5+.5)*MM,(z/MR*.5+.5)*MM];
  for(const b of buildings){const[a,c]=toM(b.x,b.z);mctx.fillStyle=b.type==='shelter'?'#ffc93c':b.type==='fire'?'#ff7a1a':'#7a4e2a';mctx.fillRect(a-1.5,c-1.5,b.type==='fence'?2:4,b.type==='fence'?2:4)}
  for(const d of dinos){if(d.dead||d.type!=='raptor'||Math.hypot(d.x-player.x,d.z-player.z)>45)continue;const[a,c]=toM(d.x,d.z);mctx.fillStyle='#e8505b';mctx.beginPath();mctx.arc(a,c,2.5,0,7);mctx.fill()}
  const[px,pz]=toM(player.x,player.z);
  mctx.save();mctx.translate(px,pz);mctx.rotate(-player.yaw+Math.PI);mctx.fillStyle='#fff';mctx.strokeStyle='#3b2a1a';mctx.lineWidth=1.5;
  mctx.beginPath();mctx.moveTo(0,-6);mctx.lineTo(4.5,4.5);mctx.lineTo(0,2.5);mctx.lineTo(-4.5,4.5);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();
  // camera view direction
  mctx.strokeStyle='#ffffff99';mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(px,pz);mctx.lineTo(px-Math.sin(cam.yaw)*14,pz-Math.cos(cam.yaw)*14);mctx.stroke();
}

/* ================= save / load ================= */
const SAVE_KEY='dinoIsland.save.v1';
function serialize(){return{p:{x:player.x,z:player.z,yaw:player.yaw,hp:player.hp,hunger:player.hunger,stamina:player.stamina,spawn:player.spawn},
  inv,tools,stats,b:buildings.map(b=>[b.type,+b.x.toFixed(2),+b.z.toFixed(2),+b.yaw.toFixed(3)]),time:world.time,day:world.day,cam:{...cam}}}
function save(){if(!started)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function applySave(d){
  resetState();Object.assign(inv,d.inv||{});Object.assign(tools,d.tools||{});Object.assign(stats,d.stats||{});
  const p=d.p||{};Object.assign(player,{x:p.x??SPAWN.x,z:p.z??SPAWN.z,yaw:p.yaw??Math.PI,hp:p.hp??100,hunger:p.hunger??100,stamina:p.stamina??100,spawn:p.spawn||{...SPAWN}});
  player.y=heightAt(player.x,player.z);
  for(const b of buildings.splice(0))scene.remove(b.mesh);
  for(const[t,x,z,yaw]of d.b||[])if(BUILD[t])addBuilding(t,x,z,yaw);
  world.time=d.time??.08;world.day=d.day??1;if(d.cam)Object.assign(cam,d.cam);
  pm.armor.visible=tools.armor;invDirty=true;
}

/* ================= game flow ================= */
let started=false,camShake=0;
const animNodes=new Set();
function startGame(data){
  $('title').hidden=true;$('hud').hidden=false;
  if(data)applySave(data);
  else{resetState();for(const b of buildings.splice(0))scene.remove(b.mesh);
    Object.assign(player,{x:SPAWN.x,z:SPAWN.z,yaw:Math.PI,hp:100,hunger:100,stamina:100,spawn:{...SPAWN},dead:false});
    player.y=heightAt(SPAWN.x,SPAWN.z);world.time=.08;world.day=1;cam.yaw=0;cam.pitch=.42;cam.dist=9}
  player.dead=false;started=true;wasNight=isNight();
  for(const d of dinos)if(Math.hypot(d.x-player.x,d.z-player.z)<25&&d.T.beh!=='skittish')d.remove();
  renderHotbar();updateQuest();
  toast(data?'다시 섬으로 돌아왔어요':'난파선에서 겨우 살아남았어요. 먼저 먹을 것부터 찾아봐요');
  save();
}
$('btnNew').onclick=()=>{initAudio();startGame(null)};
$('btnCont').onclick=()=>{initAudio();const d=loadSave();startGame(d)};
if(loadSave())$('btnCont').hidden=false;
setInterval(save,20000);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('beforeunload',save);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ================= update ================= */
function updatePlayer(dt){
  if(player.dead){pm.root.rotation.x=lerp(pm.root.rotation.x,-Math.PI/2,dt*5);return}
  player.invuln-=dt;player.cookCd-=dt;
  let ix=0,iy=0;
  if(started&&!uiOpen()&&!sleeping){
    if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
    ix+=touchMove.x;iy+=touchMove.y;
  }
  const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
  const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
  const mx=fx*iy+rx*ix,mz=fz*iy+rz*ix,moving=len>.08;
  const ground=heightAt(player.x,player.z);player.swimming=ground<-.9;
  const sprint=(keys.ShiftLeft||keys.ShiftRight||touchRun)&&moving&&player.stamina>1&&!player.swimming;
  let speed=player.swimming?3:sprint?8.5:5;if(player.swing>0)speed*=.5;
  player.x+=mx*speed*dt+player.kx*dt;player.z+=mz*speed*dt+player.kz*dt;
  player.kx*=Math.exp(-dt*8);player.kz*=Math.exp(-dt*8);
  if(player.swing>0&&player.swingTarget){const ti=targetInfo(player.swingTarget);if(ti)player.yaw=turnTo(player.yaw,Math.atan2(ti.x-player.x,ti.z-player.z),14*dt)}
  else if(moving)player.yaw=turnTo(player.yaw,Math.atan2(mx,mz),12*dt);
  // collisions
  const p={x:player.x,z:player.z},R=.4;
  for(const n of nodes){if(n.r<=0||!n.visible||n.fall>0)continue;const dx=p.x-n.x,dz=p.z-n.z;if(Math.abs(dx)>3||Math.abs(dz)>3)continue;
    const d=Math.hypot(dx,dz),m=R+n.r;if(d<m&&d>1e-4){p.x=n.x+dx/d*m;p.z=n.z+dz/d*m}}
  for(const b of buildings)if(Math.abs(b.x-p.x)<5&&Math.abs(b.z-p.z)<5)pushOut(p,R,b);
  for(const d of dinos){if(d.dead)continue;const dx=p.x-d.x,dz=p.z-d.z,m=R+d.T.radius;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;
    const l=Math.hypot(dx,dz);if(l<m&&l>1e-4){p.x=d.x+dx/l*m;p.z=d.z+dz/l*m}}
  const dc=Math.hypot(p.x,p.z);if(dc>205){p.x*=205/dc;p.z*=205/dc}
  player.x=p.x;player.z=p.z;
  // vertical
  const g2=heightAt(player.x,player.z),floor=g2<-.9?-.95:g2;
  if(player.jumpReq){player.jumpReq=false;if(player.onGround&&!player.swimming&&player.stamina>=8&&started){player.vy=7.5;player.stamina-=8;player.onGround=false}}
  player.vy-=22*dt;player.y+=player.vy*dt;
  if(player.y<=floor||(player.onGround&&player.vy<=0&&player.y-floor<.45)){player.y=floor;player.vy=0;player.onGround=true}else player.onGround=false;
  // needs
  if(started&&!sleeping){
    if(sprint)player.stamina-=18*dt;else if(player.swimming&&moving)player.stamina-=4*dt;else player.stamina+=(player.hunger<20?6:14)*dt;
    player.stamina=clamp(player.stamina,0,100);
    if(player.swimming&&player.stamina<=0){player.hp-=6*dt;if(Math.random()<dt)toast('숨이 차요! 육지로 올라가세요','bad')}
    player.hunger-=dt*(sprint?.45:.2);
    if(player.hunger<=0){player.hunger=0;player.hp-=1.2*dt}
    else if(player.hunger>45&&player.hp<100)player.hp+=.5*dt;
    if(nearFire(5))player.hp+=1.2*dt;
    player.hp=Math.min(100,player.hp);
    if(player.hp<=0)die();
  }
  // swing
  if(player.swing>0){player.swing-=dt;const pr=1-player.swing/.42;if(!player.swingHit&&pr>=.55){player.swingHit=true;if(player.swingTarget)applyHit(player.swingTarget)}}
  if(player.swing<=0){player.target=findTarget();player.tool=chooseTool(player.target)}
  if(player.swing<=0&&actionHeld&&!placing)doAction();
  for(const k in pm.tools)pm.tools[k].visible=k===player.tool;
  animatePlayer(dt,moving,sprint);
}
function animatePlayer(dt,moving,sprint){
  const P=pm;
  P.g.position.set(player.x,player.y,player.z);P.g.rotation.y=player.yaw;
  player.walk+=dt*(player.swimming?5:sprint?13:9)*(moving?1:0);
  player.amp=lerp(player.amp,moving?(sprint?.95:.7):0,1-Math.exp(-dt*10));
  const s=Math.sin(player.walk)*player.amp;
  P.legL.rotation.x=s;P.legR.rotation.x=-s;
  P.armL.rotation.x=-s*.8;P.armR.rotation.x=s*.8;P.armL.rotation.z=-.08;P.armR.rotation.z=.08;
  P.root.position.y=Math.abs(Math.sin(player.walk))*.07*player.amp;
  P.root.rotation.x=lerp(P.root.rotation.x,player.swimming?.9:sprint?.18:0,dt*8);
  P.root.position.y+=player.swimming?.35:0;
  if(!player.onGround&&!player.swimming){P.legL.rotation.x=.6;P.legR.rotation.x=-.3}
  if(player.swimming){const w=player.walk*1.2;P.armL.rotation.x=-2.6+Math.sin(w)*.9;P.armR.rotation.x=-2.6-Math.sin(w)*.9;P.legL.rotation.x=Math.sin(w*2)*.4;P.legR.rotation.x=-Math.sin(w*2)*.4}
  P.torso.scale.y=1+Math.sin(performance.now()*.003)*.015;
  if(player.swing>0){
    const pr=1-player.swing/.42;let a;
    if(pr<.35)a=lerp(0,-3.2,pr/.35);else if(pr<.6)a=lerp(-3.2,-.5,(pr-.35)/.25);else a=lerp(-.5,0,(pr-.6)/.4);
    P.armR.rotation.x=a;P.torso.rotation.y=pr<.45?-.25*pr/.45:-.25+.25*(pr-.45)/.55;
  }else P.torso.rotation.y=0;
}
function updateNodes(dt){
  for(const n of animNodes){
    if(n.shake>0)n.shake=Math.max(0,n.shake-dt);
    if(n.fall>0){n.fall+=dt;n.fallAng=Math.min(Math.PI/2*.97,n.fall*n.fall*2.6);if(n.fall>1.6){n.visible=false;n.fall=0;n.fallAng=0;burst(n.x+n.fdx*2,n.y+.5,n.z+n.fdz*2,'leaf',8)}}
    if(n.grow<1)n.grow=Math.min(1,n.grow+dt*1.2);
    nodeMatrix(n);
    if(n.shake<=0&&n.fall<=0&&n.grow>=1)animNodes.delete(n);
  }
}
let respawnTick=0;
function respawnNodes(dt){
  respawnTick+=dt;if(respawnTick<1)return;const step=respawnTick;respawnTick=0;
  for(const n of nodes){if(n.active||n.fall>0)continue;n.respawn-=step;
    if(n.respawn<=0){if(Math.hypot(n.x-player.x,n.z-player.z)<2.5){n.respawn=3;continue}
      n.active=true;n.visible=true;n.hp=n.max;n.hasBerries=true;n.grow=n.kind==='bush'?1:.01;n.shake=n.kind==='bush'?.3:0;animNodes.add(n)}}
}
function updateCamera(dt,time){
  const tx=player.x,ty=player.y+1.5,tz=player.z;
  let yaw=cam.yaw,pitch=cam.pitch,dist=cam.dist;
  if(!started){yaw=time*.05;pitch=.32;dist=26}
  const ox=Math.sin(yaw)*Math.cos(pitch)*dist,oy=Math.sin(pitch)*dist,oz=Math.cos(yaw)*Math.cos(pitch)*dist;
  let cx=tx+ox,cy=ty+oy,cz=tz+oz;
  cy=Math.max(cy,heightAt(cx,cz)+.7,.4);
  const k=1-Math.exp(-dt*(started?12:2));
  camera.position.x=lerp(camera.position.x,cx,k);camera.position.y=lerp(camera.position.y,cy,k);camera.position.z=lerp(camera.position.z,cz,k);
  if(camShake>0){camShake-=dt;const s=camShake*.6;camera.position.x+=(Math.random()-.5)*s;camera.position.y+=(Math.random()-.5)*s}
  camera.lookAt(tx,ty,tz);
}
function updateFires(time){
  let best=null,bd=60;
  for(const b of buildings){if(b.type!=='fire')continue;const d=Math.hypot(b.x-player.x,b.z-player.z);if(d<bd){bd=d;best=b}
    const[f1,f2]=b.mesh.userData.flames;const f=1+Math.sin(time*13+b.x)*.12+Math.sin(time*7.3)*.08;f1.scale.set(1,f,1);f2.scale.set(1,2-f,1);f1.rotation.y=time*2}
  if(best){fireLight.position.set(best.x,best.mesh.position.y+1.3,best.z);fireLight.intensity=(isNight()?38:10)*(1+Math.sin(time*11)*.08)}else fireLight.intensity=0;
}

let last=performance.now(),uiTick=0,popTick=0,elapsed=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  const paused=!$('panel').hidden;
  if(paused)dt=0;
  elapsed+=dt;
  if(!paused){
    if(started)updateTime(dt);
    updatePlayer(dt);
    for(let i=dinos.length-1;i>=0;i--)dinos[i]&&dinos[i].update(dt,elapsed);
    updateNodes(dt);respawnNodes(dt);updateParticles(dt);updatePlacing();
    popTick-=dt;for(const k in spawnCd)spawnCd[k]-=dt;if(popTick<=0){popTick=2;populate()}
    for(const c of clouds){c.position.x+=dt*2;if(c.position.x>260)c.position.x=-260}
  }
  updateWater(elapsed*1.2);
  updateFires(elapsed);
  updateCamera(Math.max(dt,.016),elapsed);
  updateSky();
  updateFloats(dt||.016);
  if(started){
    updateBars();updatePrompt();
    if(invDirty){invDirty=false;renderHotbar();renderPanel();updateQuest()}
    uiTick-=dt||.016;if(uiTick<=0){uiTick=.25;updateClock();drawMinimap();updateQuest();if(!$('panel').hidden)renderPanel()}
  }
  renderer.render(scene,camera);
}
populate(true);
camera.position.set(player.x,player.y+10,player.z+24);
// hot update hook for the artifact viewer: keep the run across republishes
window.claude?.hot?.snapshot?.(()=>started?{save:serialize()}:{});
function boot(data){if(data&&data.save)startGame(data.save);requestAnimationFrame(loop)}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
